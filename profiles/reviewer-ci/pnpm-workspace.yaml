# Marks profiles/reviewer-ci as its OWN standalone pnpm workspace root — without
# this file, pnpm's workspace-root detection walks up and finds
# the package's own pnpm-workspace.yaml two levels up (this
# profile is nested inside that package's directory tree), silently folding
# the profile into that unrelated workspace instead of installing it
# independently (verified 2026-09-03: `pnpm --dir profiles/reviewer-ci install`
# printed "Scope: all 2 workspace projects" and resolved relative to `../..`
# without this file present).
packages: []
# No `overrides:` block on the 0.1.7-rc.1 line, deliberately. The 0.1.5-rc.2
# profile needed one because those packages declared loose ranges, so ~23 of
# their transitive deps resolved back to the older 0.1.2-rc.1 — silent at
# install time (a peer warning only), fatal at boot: a newer consumer
# ESM-imported a symbol the older peer's build never exported (e.g.
# dsh-session-persistence-jsonl@0.1.5-rc.2 importing SessionAlreadyExistsError
# from dsh-session-persistence@0.1.2-rc.1), crashing the whole plugin tree with
# exit 1. Every `@deepseek-ai/dsh-*` package on the alpha.2 line pins its own
# graph exactly, so the same install needs no forcing (verified 2026-09-23:
# 281 @deepseek-ai packages installed, zero duplicate package names, one
# cordis@4.0.4 that satisfies the plugin's `~4.0.4` peer).
# Postinstall scripts required at runtime (node-pty/subprocess-local spawn
# agents, koffi/protobufjs/genai serve model IO). Exact versions pinned in
# pnpm-lock.yaml; review on every profile dep bump.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
# pnpm keeps only the FIRST entry per package name, so bumping our own
# release means REPLACING its entry — appending the newer version leaves it
# shadowed by the stale one and the 24h age gate keeps rejecting it (observed
# 2026-09-18). The Docker build additionally passes
# --config.minimumReleaseAge=0.
minimumReleaseAgeExclude:
  - '@ddtcorex/maestro-reviewer@0.18.0'
