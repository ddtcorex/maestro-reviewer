# ddtcorex/maestro-reviewer: reviewer pipeline
#
# Read docs/ci-reviewer-setup.md before changing anything here.
#
# Where this file lives: in a separate CONFIG PROJECT whose branch is
# protected for Maintainers only, never in the reviewer project itself. The
# reviewer project points at it with Settings > CI/CD > General pipelines >
# Custom CI config path = maestro-reviewer.yml@<group>/<config project>.
# GitLab only lets a user trigger a protected downstream branch when they
# can merge it, so the reviewer branch must let Developers merge; this file
# receives every key, so it must sit where they cannot. Everyone who
# triggers the reviewer, and the bot, needs Reporter on the config project.
# resolve refuses to run otherwise.
#
# Trust model: a trigger can override every variable of a downstream job,
# the image included. So the reviewer project MUST forbid pipeline variables:
#   Settings > CI/CD > Variables > "Minimum role to use pipeline variables"
#   = no_one_allowed   (API: ci_pipeline_variables_minimum_override_role)
# Source bridges therefore pass no variables; resolve asks GitLab which MR
# triggered this pipeline (GraphQL upstream), decides the provider route, and
# writes review-child.yml, whose review job carries
# `environment: review/<source project id>` and the identity as literals.
stages: [resolve, review]

variables:
  # Pin the tag (or digest) for reproducibility.
  REVIEWER_IMAGE: "ddtcorex/maestro-reviewer:0.17.0"

resolve:
  stage: resolve
  # The image's ENTRYPOINT starts a review; resolve needs its own command.
  image: { name: $REVIEWER_IMAGE, entrypoint: [""] }
  # The `resolve` environment is what lets REVIEW_RESOLVE_TOKEN (environment
  # scope "resolve") reach this job and never the review job.
  environment: { name: resolve, action: prepare }
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  variables:
    GIT_STRATEGY: none
  script:
    - /resolve.sh
  artifacts:
    expire_in: 1 day
    paths:
      - review-child.yml

review:
  stage: review
  needs: [resolve]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  trigger:
    include:
      - artifact: review-child.yml
        job: resolve
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false

# Periodic report: create a pipeline schedule on this project (Build >
# Pipeline schedules, no variables; for example weekly). The job reads the
# review jobs' review-report.json of the last REVIEW_REPORT_DAYS (default 7,
# at most 30) with REVIEW_GITLAB_TOKEN and keeps periodic-report.json and .md.
report:
  stage: review
  image: { name: $REVIEWER_IMAGE, entrypoint: [""] }
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_STRATEGY: none
  script:
    - /report.sh
  artifacts:
    expire_in: 90 days
    paths:
      - periodic-report.json
      - periodic-report.md

# CI/CD variables of this project (Settings > CI/CD > Variables).
#
# Tokens, both masked and protected:
# - REVIEW_GITLAB_TOKEN (environment scope *): bot user or group/project
#   access token, api scope, Developer on every source project (posts the
#   review, clones for deep), Reporter on this project (resolve reads its own
#   upstream through it; Maintainer is refused) and exactly Reporter on the
#   config project (Developer or above is refused; REVIEW_ACCEPT_PRIVILEGED_BOT
#   = "1" turns both role refusals into warnings, temporarily, until a
#   dedicated bot exists). CI_JOB_TOKEN is not
#   enough: proven 2026-09-04 on GitLab 18.11, reads work but POST /notes
#   answers 401.
# - REVIEW_RESOLVE_TOKEN (environment scope "resolve"): project access token
#   of THIS project, Maintainer, read_api. It reads the restriction setting
#   and the per-project variable scopes, which a Maintainer can see for every
#   project, so it is kept out of the review job, where an LLM agent reads
#   untrusted MR content.
#
# Allowlist, environment scope * (required; resolve refuses to run without it):
# - REVIEW_ALLOWED_NAMESPACES: comma-separated groups or projects allowed to
#   use this reviewer, for example "my-group/, other-group/app". A source
#   project outside it gets no review and no note.
#
# Provider, defaults at environment scope *:
# - DEEPSEEK_API_KEY: the baked deepseek-official route, or
# - REVIEW_LLM_API_KEY + REVIEW_LLM_BASE_URL + REVIEW_LLM_MODEL (optional
#   REVIEW_LLM_API: openai-completions | openai-responses): any
#   OpenAI-compatible endpoint.
#
# Per source project, environment scope review/<source project id> (for
# example review/123). A project route is all or nothing: with a scoped
# REVIEW_LLM_API_KEY it needs REVIEW_LLM_MODEL and REVIEW_LLM_PROVIDER
# (openai | anthropic | gemini | openrouter | deepseek | custom) or
# REVIEW_LLM_BASE_URL at the same scope, else resolve fails naming what is
# missing. A preset fills the base URL; custom needs REVIEW_LLM_BASE_URL.
# - REVIEW_REQUIRE_PROJECT_KEY: "1" never falls back to the default key; with
#   no scoped key the MR gets one note and no review. Set at * it applies to
#   every project; a scoped "0" opts one project out.
# Wildcard scopes (review/*) are refused for all of these: use exact scopes.
# - REVIEW_MODE: quick (default) | deep
# - REVIEW_PROFILE: magento2 | laravel | symfony | wordpress | generic
# - REVIEW_ON_PUSH: "1" re-reviews new pushes (default: first review only)
#
# On demand: the MR label maestro-review::deep runs one deep review of the
# current head (retry the bridge job or push); the bot removes the label once
# the deep review is posted.
