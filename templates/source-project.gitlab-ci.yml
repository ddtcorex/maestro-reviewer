# example-group/example-project: source project (copy this job into YOUR source project)
stages: [review]

# Runs for every MR pipeline (fork MRs too: this job holds no secrets).
maestro:trigger-review:
  stage: review
  # The job only fails on a reviewer-infra problem (LLM/API error, timeout,
  # failed comment post), never because findings were reported. Non-blocking
  # so an outage of the shared reviewer project can't block this project's
  # merge or deploy; drop the line to hard-block merges on such failures.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # The reviewer project forbids pipeline variables, so this bridge must pass
  # none and forward none: not the project's global `variables:` either.
  # Review settings (mode, profile, provider, re-review on push) live on the
  # reviewer project as CI variables scoped to review/<this project's id>.
  # For one deep review of the current head, add the MR label
  # maestro-review::deep and retry this job.
  inherit:
    variables: false
  trigger:
    project: example-group/maestro-reviewer   # the reviewer project path
    branch: main                              # its default branch (master on some instances)
    strategy: depend                          # surface the reviewer pipeline status on the MR
    forward:
      yaml_variables: false
      pipeline_variables: false
